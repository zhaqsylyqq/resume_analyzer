# INF-07: template of an environment's secrets - two Kubernetes Secrets, one per workload,
# so each pod gets only what it needs. Copy to deploy/envs/<env>/secrets.yaml (git-ignored),
# fill in, then `scripts/secrets.sh encrypt <env>` writes secrets.enc.yaml (committed) and
# deletes the plain copy. Never commit real values in clear text: CI refuses it.
apiVersion: v1
kind: Secret
metadata:
  name: hrscreen-web
type: Opaque
stringData:
  FLASK_SECRET_KEY: "64 hex characters: openssl rand -hex 32"
  DATA_KEY: "32 bytes in base64: openssl rand -base64 32 (the SAME as the worker's)"
  DATABASE_URL: "postgresql://hrscreen:<password>@<db host>:5432/hrscreen"
  # The vacancy bias check still runs in the web process, so web needs the AI key for now.
  # Remove this line once that check moves to the worker (then web has no AI key, T-09).
  DEEPSEEK_API_KEY: "sk-..."
---
apiVersion: v1
kind: Secret
metadata:
  name: hrscreen-worker
type: Opaque
stringData:
  FLASK_SECRET_KEY: "the same value as in hrscreen-web"
  DATA_KEY: "the same value as in hrscreen-web"
  DATABASE_URL: "the same value as in hrscreen-web"
  DEEPSEEK_API_KEY: "sk-..."

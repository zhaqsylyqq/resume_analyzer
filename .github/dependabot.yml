# CI-04. Dependabot opens PRs; CI (tests, lint, security, image scan) must pass before merge.
# Python packages are NOT handled here: requirements*.lock are generated by uv, which
# Dependabot cannot regenerate. Instead, security.yml runs pip-audit every Monday, and
# docs/specs/CI-stage1.md describes the monthly `uv pip compile --upgrade` routine.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Almaty
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7  # let a release settle before adopting it (supply-chain safety)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Almaty
    commit-message:
      prefix: "docker"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3

# APP-02: Alembic for the PostgreSQL schema. The app applies migrations itself at start-up
# (or `flask --app app db-upgrade`); this file is for writing new ones:
#   alembic revision -m "add something"      (DATABASE_URL from .env)
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s

<!doctype html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ t('app.tagline') }}{% endblock %} · {{ t('app.name') }}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo-mark.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">{{ t('nav.skip') }}</a>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="{{ url_for('core.index') }}">
        <img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="" width="32" height="32">
        <span class="brand__name">{{ t('app.name') }}</span>
      </a>
      <nav class="topbar__nav" aria-label="{{ t('nav.main') }}">
        {% block nav %}{% endblock %}
      </nav>
      <div class="topbar__actions">
        <div class="lang-switch" role="group" aria-label="{{ t('nav.language') }}">
          {% for code in config.LANGUAGES %}
            <a href="{{ url_for('core.set_language', code=code, next=request.full_path.rstrip('?')) }}"
               class="lang-switch__item{% if get_locale() == code %} is-active{% endif %}"
               {% if get_locale() == code %}aria-current="true"{% endif %}>{{ code | upper }}</a>
          {% endfor %}
        </div>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="{{ t('nav.theme') }}" title="{{ t('nav.theme') }}">
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>{{ t('footer.privacy') }}</span>
    </div>
  </footer>
  <div class="toast-region" aria-live="polite" aria-atomic="false" data-toasts></div>
  {% block scripts %}{% endblock %}
</body>
</html>
